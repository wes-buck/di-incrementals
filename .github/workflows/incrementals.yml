name: DI Incrementals

# Race weekends: check NHRA every few minutes, publish when a new round posts.
# GitHub runs schedules in UTC and can start them a few minutes late under load;
# each run checks three times, about 90 seconds apart, to keep the gap short.
on:
  schedule:
    - cron: "*/5 * * * 4,5,6,0"   # Thursday through Sunday
    - cron: "*/5 0-6 * * 1"       # Sunday night Central (early Monday UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incrementals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check out the live site
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add site origin/gh-pages
            (cd site && git checkout -B gh-pages origin/gh-pages)
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rf . -q)
          fi

      - name: Pull NHRA results and publish
        env:
          DI_DATA_DIR: site/data
        run: |
          git config --global user.name "DI Incrementals"
          git config --global user.email "incrementals@dragillustrated.com"
          for pass in 1 2 3; do
            out=$(python run.py)
            echo "$out"
            if echo "$out" | grep -q CHANGED$; then
              cp -f CNAME site/CNAME 2>/dev/null || true
              touch site/.nojekyll
              (cd site && git add -A && git commit -qm "Update: $(echo "$out" | head -1)" && git push -q origin gh-pages)
            fi
            [ $pass -lt 3 ] && sleep 90
          done
