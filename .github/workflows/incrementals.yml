name: DI Incrementals

# Race days: one job stays on and checks NHRA every 60 seconds, publishing the moment a round changes.
# Each poller lives ~5h40m and, after its first pass, queues its own replacement (workflow_dispatch
# with poll=340), which starts the moment it finishes. GitHub's cron only fires every few hours in
# practice, so cron is just the backup that restarts the relay if it ever breaks. Off weeks the
# first pass prints IDLE and the job exits without queuing a replacement.
# Pushes and manual runs (blank poll) do a single quick pass.
on:
  schedule:
    - cron: "17 */2 * * 4,5,6,0"   # Thursday through Sunday (UTC), backup only
    - cron: "17 0-6/2 * * 1"       # Sunday night Central (early Monday UTC), backup only
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      event:
        description: "Event to build instead of the schedule (e.g. midwest). Leave blank for this week's race."
        required: false
      round:
        description: "Round to open on (e.g. Q1). Blank = latest."
        required: false
      poll:
        description: "Minutes to keep polling (340 = race-day poller). Blank = one pass."
        required: false

permissions:
  contents: write
  actions: write   # lets a poller queue its replacement

concurrency:
  # race-day pollers queue behind each other; pushes and manual runs get their own lane
  group: incrementals-${{ (github.event_name == 'schedule' || github.event.inputs.poll != '') && 'poll' || 'oneshot' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check out the live site
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add site origin/gh-pages
            (cd site && git checkout -B gh-pages origin/gh-pages)
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rf . -q)
          fi

      - name: Pull NHRA results and publish
        env:
          DI_DATA_DIR: site/data
          POLL: ${{ github.event_name == 'schedule' && '340' || github.event.inputs.poll || '0' }}
          DI_POLLING: ${{ (github.event_name == 'schedule' || github.event.inputs.poll != '') && '1' || '0' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "DI Incrementals"
          git config --global user.email "incrementals@dragillustrated.com"
          end=$(( $(date +%s) + POLL * 60 ))
          relayed=0
          while true; do
            # start every pass from the newest published copy (another job may have published)
            (cd site && git fetch -q origin gh-pages && git reset -q --hard origin/gh-pages) || true
            if [ -n "${{ github.event.inputs.event }}" ]; then
              out=$(python run.py 2026 "${{ github.event.inputs.event }}" "${{ github.event.inputs.round || 'LATEST' }}") || true
            else
              out=$(python run.py) || true
            fi
            echo "$(date -u +%H:%M:%S) $out"
            if echo "$out" | grep -qx CHANGED; then
              cp -f CNAME site/CNAME 2>/dev/null || true
              touch site/.nojekyll
              (cd site && git add -A && git commit -qm "Update: $(echo "$out" | head -1 | cut -c1-200)" && \
                (git push -q origin gh-pages || (git fetch -q origin gh-pages && git rebase -q -X theirs origin/gh-pages && git push -q origin gh-pages))) || echo "publish failed; next pass retries"
            fi
            if echo "$out" | grep -q "^IDLE"; then break; fi
            # race window: queue the next poller once; it waits in the concurrency lane and takes over when this one ends
            if [ "$POLL" -gt 0 ] && [ "$relayed" = 0 ] && [ -z "${{ github.event.inputs.event }}" ]; then
              gh workflow run incrementals.yml --repo "${{ github.repository }}" --ref main -f poll=340 \
                && relayed=1 && echo "queued next poller" || echo "could not queue next poller; cron backup will restart"
            fi
            [ "$(date +%s)" -ge "$end" ] && break
            sleep 60
          done
